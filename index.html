<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23286bb5'/><circle cx='8' cy='8' r='4' fill='%23ffd740'/></svg>" />
    <title>NILO</title>
    <script>
      // Suprime ruído espúrio de extensões de navegador injetadas na página (ex: tradutores, adblock, antivírus, carteiras)
      // que deixam canais de mensagens abertos (erro clássico "A listener indicated an asynchronous response...").
      function isExtensionChannelError(err) {
        var msg = (err && (err.message || (err.reason && (err.reason.message || String(err.reason))) || String(err))) || '';
        return typeof msg === 'string' && (
          msg.indexOf('message channel closed') !== -1 ||
          msg.indexOf('listener indicated an asynchronous response') !== -1
        );
      }
      window.addEventListener('unhandledrejection', function (e) {
        if (isExtensionChannelError(e.reason || e)) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function (e) {
        if (isExtensionChannelError(e.error || e.message || e)) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
  </head>
  <body>
    <main id="app" aria-label="NILO"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
