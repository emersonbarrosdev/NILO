<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23286bb5'/><circle cx='8' cy='8' r='4' fill='%23ffd740'/></svg>" />
    <title>NILO</title>
    <script>
      // Suprime ruído espúrio de extensões de terceiros do Chrome (ex: tradutores, adblock, antivírus, senhas)
      // que deixam canais de mensagens abertos ao recarregar a página (erro clássico "message channel closed").
      window.addEventListener('unhandledrejection', function (event) {
        var msg = event.reason && (event.reason.message || String(event.reason));
        if (typeof msg === 'string' && msg.indexOf('message channel closed before a response was received') !== -1) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <main id="app" aria-label="NILO"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
